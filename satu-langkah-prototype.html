<!doctype html>
<html lang="ms" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satu Langkah</title>
<style>
:root{
  --bg:#f4f7f7;--surface:#ffffff;--surface2:#eaf2f3;--text:#1f2f33;--muted:#4d6368;--border:#c5d6d9;
  --primary:#245C68;--primary-h:#1b4a54;--on-primary:#ffffff;--soft:#dcebed;--grey:#e8eded;--amber:#fbeccb;--rose:#f7e1df;
  --err:#a12a2a;--err-bg:#fbeaea;--ok:#1f6b4f;--focus:#0b3d91;--tile:#ffffff;--rw1:#e6f1f2;--rw2:#cfe3ea;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d272a;--surface:#27353a;--surface2:#2f4046;--text:#dde8ea;--muted:#a9bec3;--border:#44585e;
    --primary:#2f7a88;--primary-h:#3a8b9a;--soft:#2f4a50;--grey:#34454a;--amber:#4a4331;--rose:#4a3638;
    --err:#ff9d9d;--err-bg:#4a2c2e;--ok:#8fd4b5;--focus:#9ecbff;--tile:#eef5f6;--rw1:#2c4248;--rw2:#243a44;
  }
}
:root[data-theme="dark"]{
  --bg:#1d272a;--surface:#27353a;--surface2:#2f4046;--text:#dde8ea;--muted:#a9bec3;--border:#44585e;
  --primary:#2f7a88;--primary-h:#3a8b9a;--soft:#2f4a50;--grey:#34454a;--amber:#4a4331;--rose:#4a3638;
  --err:#ff9d9d;--err-bg:#4a2c2e;--ok:#8fd4b5;--focus:#9ecbff;--tile:#eef5f6;--rw1:#2c4248;--rw2:#243a44;
}
*{box-sizing:border-box}
html{font-size:100%}html.size115{font-size:115%}html.size130{font-size:130%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.55;font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:12px 16px;border:2px solid var(--focus);z-index:100}
.skip:focus{left:8px}
/* ---- Header (fixed position, same on every view) ---- */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--border)}
.top-in{max-width:1080px;margin:0 auto;padding:8px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;min-height:52px;padding:2px 6px;text-align:left;border-radius:12px}
.brand .mark{background:var(--tile);border-radius:12px;padding:3px 5px;display:flex}
.brand b{display:block;font-size:1.35rem;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:.82rem}
.top-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top-r ul{list-style:none;margin:0;padding:0;display:flex;gap:8px}
.navbtn{min-height:46px;padding:8px 16px;border-radius:12px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.navbtn[aria-current="page"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.navbtn:hover:not([aria-current="page"]){background:var(--surface2)}
.badge{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#fbeccb;color:#3d3320;border-radius:999px;padding:1px 8px}
/* language switch (light-switch style) */
.langsw{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:6px 14px;border:2px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:700;font-size:.95rem}
.langsw .lg{color:var(--muted);font-weight:600}
.langsw[aria-checked="false"] .l-bm,.langsw[aria-checked="true"] .l-en{color:var(--text);font-weight:800}
.track{position:relative;width:50px;height:28px;border-radius:999px;background:var(--primary);flex:none}
.thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.langsw[aria-checked="true"] .thumb{transform:translateX(22px)}
/* ---- Page ---- */
main{max-width:1080px;margin:0 auto;padding:28px 24px 56px;min-height:70vh}
main.has-ctl{padding-bottom:160px}
h1{font-size:2rem;line-height:1.2;margin:4px 0 6px}
h1:focus{outline:none}
h2{font-size:1.2rem;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 20px;font-size:1.1rem}
.small{font-size:.9rem;color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--border);border-radius:22px;padding:26px}
.two{display:grid;gap:30px;grid-template-columns:1fr;align-items:center}
@media(min-width:880px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.tabs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 22px;padding-bottom:16px;border-bottom:2px dashed var(--border)}
/* buttons */
.btn{min-height:52px;min-width:52px;padding:10px 22px;border-radius:14px;border:2px solid transparent;font-weight:700;cursor:pointer;background:var(--grey);transition:background-color .15s;font-size:1rem}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-h)}
.btn.outline{background:var(--surface);border-color:var(--primary)}
.btn.outline:hover{background:var(--soft)}
.btn.big{min-height:60px;font-size:1.15rem;padding:12px 30px}
.btn.sm{min-height:44px;padding:8px 14px;font-size:.95rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
/* Now / Next / Done */
ol.steps{list-style:none;margin:0 0 24px;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
ol.steps li{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--grey);color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.85rem;padding:6px;text-align:center}
ol.steps li.past{background:var(--soft);color:var(--text)}
ol.steps li[aria-current="step"]{background:var(--primary);color:var(--on-primary)}
/* Photos: fixed 4:3 so nothing shifts */
.frame{position:relative;width:100%;max-width:500px;aspect-ratio:4/3;border-radius:18px;background:var(--surface2);border:2px solid var(--border);overflow:hidden;margin:0 auto}
.frame>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame.blur>*{filter:blur(9px)}
.empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:var(--muted)}
.th{display:block;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface2);flex:none}
.th>*{width:100%;height:100%;object-fit:cover;display:block}
.th.sm{width:68px;border-radius:8px}
.th.blur>*{filter:blur(4px)}
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
.sbtn{border-radius:14px;border:2px solid var(--border);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px;font-weight:600;font-size:.95rem;min-height:44px}
.sbtn[aria-pressed="true"]{border-color:var(--primary);background:var(--soft);box-shadow:inset 0 0 0 2px var(--primary)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.wcard{border-radius:18px;border:2px solid var(--border);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:8px 8px 12px;font-weight:700;font-size:1.2rem;text-align:center}
.wcard:hover{background:var(--soft)}
.wcard.textonly{min-height:84px;justify-content:center;font-size:1.5rem;padding:12px}
.wcard.hint{border-style:dashed;border-width:4px;border-color:var(--primary)}
.wcard .lbl{font-weight:400;font-size:.85rem;color:var(--muted)}
/* pupil control bar (fixed, always visible) */
footer#controls{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 16px 12px;pointer-events:none}
footer#controls[hidden]{display:none}
.ctl-wrap{pointer-events:auto;max-width:800px;margin:0 auto;background:var(--surface);border:2px solid var(--border);border-radius:22px;padding:10px 10px 6px}
.ctl-in{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ctl-in .btn{min-height:54px;padding:8px 6px;border-radius:999px}
.c-ulang{background:var(--soft)}.c-bantu{background:var(--grey)}.c-rehat{background:var(--amber)}.c-henti{background:var(--rose)}
.ctl-note{text-align:center;font-size:.85rem;color:var(--muted);padding:4px 0 2px}
/* forms */
.field{margin:0 0 22px}
label,legend{display:block;font-weight:700;margin-bottom:4px}
input[type=text],select,textarea{width:100%;min-height:50px;padding:10px 14px;border:2px solid var(--border);border-radius:12px;background:var(--surface)}
textarea{min-height:100px}
input[aria-invalid="true"],textarea[aria-invalid="true"],fieldset[aria-invalid="true"]{border-color:var(--err);background:var(--err-bg)}
.hintt{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px;font-weight:400}
.msg{min-height:1.6rem;font-size:.95rem;margin-top:4px;font-weight:600}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
fieldset{border:2px solid var(--border);border-radius:16px;padding:16px;margin:0 0 22px}
.wopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wopt{display:flex;align-items:center;gap:10px;min-height:60px;border:2px solid var(--border);border-radius:14px;padding:8px 12px;cursor:pointer;margin:0;font-weight:600}
.wopt input{width:26px;height:26px;flex:none}
.wopt:has(input:checked){background:var(--soft);border-color:var(--primary)}
ul.pmlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li.pm{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:2px solid var(--border);border-radius:14px;padding:8px 12px}
li.pm strong{min-width:90px}
.errsum{background:var(--err-bg);border:2px solid var(--err);border-radius:14px;padding:12px 16px;margin-bottom:18px}
.errsum[hidden]{display:none}
.errsum a{color:inherit;font-weight:700}
.note{background:var(--soft);border-radius:14px;padding:12px 16px;margin:0 0 18px;font-size:.95rem}
.status{min-height:1.6rem;font-weight:600;color:var(--primary)}
.dot{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;border:2px solid var(--primary);flex:none;font-weight:700}
.dot.on{background:var(--primary);color:var(--on-primary)}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:center;min-height:44px}
.list{margin:0;padding-left:1.2em}
.center{text-align:center}
/* reward */
.reward{display:grid;justify-items:center;text-align:center;gap:8px;padding:34px 24px 40px;border-radius:28px;background:linear-gradient(180deg,var(--rw1),var(--rw2));border:2px solid var(--border)}
.reward h1{font-size:3.2rem;margin:4px 0 0}
.reward .sub{margin:0 0 14px;font-size:1.2rem}
.mascot{width:min(230px,60vw);height:auto;animation:pop .5s ease-out both}
.mascot.s{width:150px}
@keyframes pop{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(15,30,34,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:2px solid var(--border);border-radius:22px;max-width:500px;width:100%;padding:26px;max-height:92vh;overflow:auto}
.modal.calm{background:var(--soft)}
.modal h2{font-size:1.5rem}
.modal .row{margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
html.reduce *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
@media(max-width:620px){h1{font-size:1.65rem}.reward h1{font-size:2.5rem}.ctl-in .btn{font-size:.9rem}}
</style>
</head>

<header class="top">

/* ---------- Photos ---------- */
const sampleKey=k=>k==='kabur'?'cawan':k;
function photoFor(key,alt){
 const c=S.custom[key];
 if(c)return `<img src="${c}" width="480" height="360" alt="${esc(alt||'')}">`;
 return `<svg viewBox="0 0 480 360" preserveAspectRatio="xMidYMid slice" ${alt?`role="img" aria-label="${esc(alt)}"`:'aria-hidden="true"'} focusable="false"><use href="#ph-${key}"/></svg>`;
}
const thumb=(k,cls='')=>`<span class="th ${cls}">${photoFor(k)}</span>`;
function photoHTML(){
 if(S.camOn)return `<div class="frame"><video id="cam" width="480" height="360" autoplay playsinline muted aria-label="${t('photo_alt')}"></video></div>`;
 const p=S.photo;
 if(p&&p.type==='camera')return `<div class="frame"><img src="${p.url}" width="480" height="360" alt="${t('photo_alt')}"></div>`;
 const k=p?p.key:S.sample;
 if(k)return `<div class="frame ${k==='kabur'?'blur':''}">${photoFor(sampleKey(k),t('photo_sample',k==='kabur'?t('blurry'):wordOf(k)))}</div>`;
 return `<div class="frame"><div class="empty">${t('ph_empty')}</div></div>`;
}
function readImage(file,max,cb){
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{
   const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
   c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   cb(c.toDataURL('image/jpeg',.8));};im.src=fr.result;};
 fr.readAsDataURL(file);
}

/* ---------- Helpers ---------- */
function announce(m){const l=$('#live');l.textContent='';setTimeout(()=>l.textContent=m,30)}
function speechOK(){return S.settings.sound&&'speechSynthesis' in window}
function setStatus(m){const el=$('#audio-status');if(el)el.textContent=m}
function speak(text){
 setStatus(speechOK()?t('playing',text):t('word_is',text));
 if(!speechOK())return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ms-MY';u.rate=.85;speechSynthesis.speak(u);}catch(e){}
}
function stopCamera(){if(S.stream){S.stream.getTracks().forEach(tr=>tr.stop());S.stream=null}S.camOn=false}
function strip(phase){
 const L=[t('now'),t('next'),t('done')];
 return `<ol class="steps" aria-label="${t('steps_aria')}">${L.map((x,i)=>`<li class="${i<phase?'past':''}" ${i===phase?'aria-current="step"':''}>${x}</li>`).join('')}</ol>`;
}
const mascot=(cls='')=>`<svg class="mascot ${cls}" viewBox="0 0 300 260" aria-hidden="true" focusable="false"><use href="#mascot-art"/></svg>`;
function matchResult(){ // SIMULATED matching
 const p=S.photo;if(!p)return null;
 if(p.type==='sample'&&p.key!=='kabur'&&S.lesson.words.includes(p.key))return p.key;
 return null;
}
function newRound(word,via){const r={word,via,completed:false};S.round=r;S.rounds.push(r);S.sessionStarted=true}
function resetPhoto(){stopCamera();S.photo=null;S.sample=null;S.camErr=false}
function startSession(){S.rounds=[];S.supports={ulang:0,bantu:0,rehat:0,henti:0};S.stopped=false;S.ended=false;S.round=null;S.sessionStarted=false;resetPhoto();S.hint=S.wrong=false}

/* ---------- Render ---------- */
function applySettings(){
 const h=document.documentElement;
 h.lang=S.lang==='ms'?'ms':'en';h.setAttribute('data-theme',S.settings.theme);
 h.classList.toggle('size115',S.settings.size==='115');h.classList.toggle('size130',S.settings.size==='130');h.classList.toggle('reduce',!!S.settings.motion);
 $('#tagline').textContent=t('tagline');$('#skip').textContent=t('skip');
 $('#p-stu').textContent=t('portal_s');$('#p-tea').innerHTML=`${t('portal_t')} <span class="badge">${t('demo')}</span>`;
 $('#portals').setAttribute('aria-label',t('nav_portals'));$('#n-set').textContent='⚙ '+t('nav_set');
 const sw=$('#langsw');sw.setAttribute('aria-checked',S.lang==='en'?'true':'false');sw.setAttribute('aria-label',t('langlabel'));
 document.querySelectorAll('[data-ctl]').forEach(b=>b.textContent=t(b.dataset.ctl));$('#ctl-note').textContent=t('ctl_note');
}
function render(opts={}){
 const sc=cur();if(sc!=='p-photo'&&S.camOn)stopCamera();
 const main=$('#main');main.innerHTML=(S.portal==='teacher'?teacherTabs():'')+SC[sc]();
 const isP=S.portal==='student';main.classList.toggle('has-ctl',isP);$('#controls').hidden=!isP;
 document.querySelectorAll('[data-portal]').forEach(b=>b.dataset.portal===S.portal?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 if(sc==='p-photo'&&S.camOn&&S.stream){const v=$('#cam');if(v){v.srcObject=S.stream;v.play&&v.play().catch(()=>{})}}
 if(sc==='setup')['title','goal','code','words'].forEach(n=>{if(S.touched[n])setMsg(n)});
 if(!opts.keepFocus){const h=$('#h1');if(h)h.focus();window.scrollTo(0,0);announce((h&&h.textContent)||'')}
 else if(opts.focusSel){const el=$(opts.focusSel);if(el)el.focus()}
}
function go(s,o){if(s.startsWith('p-')){S.portal='student';S.pscreen=s}else{S.portal='teacher';S.tab=s}render(o)}

/* ---------- Validation (setup form) ---------- */
function validate(n){const L=S.lesson;
 if(n==='title'){const v=L.title.trim();if(!v)return t('e_title_empty');if(v.length<3)return t('e_title_short');if(v.length>40)return t('e_title_long')}
 if(n==='goal'){const v=L.goal.trim();if(!v)return t('e_goal_empty');if(v.length<15)return t('e_goal_short',v.length)}
 if(n==='code'){const v=L.code.trim();if(!v)return t('e_code_empty');if(v.length>12)return t('e_code_long')}
 if(n==='words'){const c=L.words.length;if(c<3)return t('e_words_min',c);if(c>8)return t('e_words_max')}
 return ''}
function setMsg(n){const el=$('#m-'+n);if(!el)return;const err=validate(n);const inp=$('#f-'+n);
 if(inp){if(err)inp.setAttribute('aria-invalid','true');else inp.removeAttribute('aria-invalid')}
 el.className='msg '+(err?'err':'ok');
 el.innerHTML=err?`<span aria-hidden="true">⚠</span> ${err}`:`<span aria-hidden="true">✓</span> ${n==='words'?t('words_count',S.lesson.words.length):t('ok')}`;
 return err}
const deb={};
function debounced(n){clearTimeout(deb[n]);deb[n]=setTimeout(()=>{S.touched[n]=true;setMsg(n)},500)}

/* ---------- Modal with focus trap ---------- */
let lastFocus=null;
function openModal({title,body,actions,calm}){
 lastFocus=document.activeElement;const root=$('#modal-root');
 root.innerHTML=`<div class="backdrop"><div class="modal ${calm?'calm':''}" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t">${title}</h2><div>${body}</div><div class="row">${actions.map((a,i)=>`<button class="btn ${a.cls||'outline'}" data-mact="${i}">${a.label}</button>`).join('')}</div></div></div>`;
 document.querySelectorAll('header.top,main,footer#controls').forEach(e=>e.inert=true);
 root._actions=actions;const first=root.querySelector('select,input,button');(first||root.querySelector('.modal')).focus();
 root.addEventListener('keydown',trap);
}
function closeModal(){const root=$('#modal-root');root.removeEventListener('keydown',trap);root.innerHTML='';root._actions=null;
 document.querySelectorAll('header.top,main,footer#controls').forEach(e=>e.inert=false);
 if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
function trap(e){
 if(e.key==='Escape'){e.preventDefault();closeModal();return}
 if(e.key!=='Tab')return;
 const f=[...$('#modal-root').querySelectorAll('button,select,input,textarea,[href]')].filter(x=>!x.disabled);
 if(!f.length)return;const a=f[0],z=f[f.length-1];
 if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
}
function settingsModal(){
 const sel=(id,opts,val)=>`<select id="${id}">${opts.map(([v,l])=>`<option value="${v}" ${v===val?'selected':''}>${l}</option>`).join('')}</select>`;
 openModal({title:t('set_t'),body:`
  <div class="field"><label for="s-size">${t('set_size')}</label>${sel('s-size',[['100',t('size_n')],['115',t('size_l')],['130',t('size_xl')]],S.settings.size)}</div>
  <div class="field"><label for="s-theme">${t('set_theme')}</label>${sel('s-theme',[['auto',t('theme_auto')],['light',t('theme_light')],['dark',t('theme_dark')]],S.settings.theme)}</div>
  <label class="wopt" for="s-sound"><input type="checkbox" id="s-sound" ${S.settings.sound?'checked':''}>${t('set_sound')}</label>
  <label class="wopt" for="s-motion" style="margin-top:10px"><input type="checkbox" id="s-motion" ${S.settings.motion?'checked':''}>${t('set_motion')}</label>`,
  actions:[{label:t('close'),cls:'primary',fn:()=>closeModal()}]});
}

/* ---------- Pupil controls ---------- */
const HELP={'p-start':'h_start','p-photo':'h_photo','p-confirm':'h_confirm','p-choose':'h_choose','p-practice':'h_practice','p-reward':'h_reward','p-end':'h_reward'};
function control(c){
 if(S.ended&&c!=='bantu')return;
 if(c==='ulang'){S.supports.ulang++;
  if(S.pscreen==='p-photo'){resetPhoto();render({keepFocus:true});return}
  if(S.round&&(S.pscreen==='p-confirm'||S.pscreen==='p-practice'))speak(wordOf(S.round.word));else announce($('#h1')?$('#h1').textContent:'');
  return}
 if(c==='bantu'){S.supports.bantu++;
  const extra=S.pscreen==='p-practice'?`<div class="row"><button class="btn outline" id="hintbtn">${t('hint_show')}</button></div>`:'';
  openModal({title:t('help_t'),body:`<p>${t(HELP[S.pscreen]||'h_start')}</p>${extra}<p id="help-ok" class="msg ok" aria-live="polite"></p>`,
   actions:[{label:t('help_teacher'),cls:'outline',fn:()=>{$('#help-ok').textContent=t('help_teacher_ok')}},{label:t('close'),cls:'primary',fn:()=>closeModal()}]});
  const hb=$('#hintbtn');if(hb)hb.onclick=()=>{S.hint=true;closeModal();render({keepFocus:true})};
  return}
 if(c==='rehat'){S.supports.rehat++;try{speechSynthesis.cancel()}catch(e){}
  openModal({title:t('br_t'),body:`<p style="font-size:1.2rem">${t('br_p')}</p>`,calm:true,actions:[{label:t('resume'),cls:'primary big',fn:()=>closeModal()}]});return}
 if(c==='henti'){
  openModal({title:t('st_t'),body:`<p>${t('st_p')}</p>`,actions:[{label:t('st_no'),cls:'primary',fn:()=>closeModal()},{label:t('st_yes'),cls:'outline',fn:()=>{closeModal();S.supports.henti++;S.stopped=true;S.ended=true;S.sessionStarted=true;stopCamera();go('p-end')}}]});return}
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
 const m=e.target.closest('[data-mact]');
 if(m){const root=$('#modal-root');const a=root._actions&&root._actions[+m.dataset.mact];if(a)a.fn();return}
 const pt=e.target.closest('[data-portal]');
 if(pt){S.portal=pt.dataset.portal;render();return}
 const tb=e.target.closest('[data-tab]');
 if(tb){S.portal='teacher';S.tab=tb.dataset.tab;render();return}
 const c=e.target.closest('[data-ctl]');if(c){control(c.dataset.ctl);return}
 const s=e.target.closest('[data-sample]');
 if(s){S.sample=s.dataset.sample;stopCamera();S.photo=null;S.camErr=false;render({keepFocus:true,focusSel:`[data-sample="${S.sample}"]`});return}
 const p=e.target.closest('[data-pick]');
 if(p){newRound(p.dataset.pick,'pick');S.hint=S.wrong=false;go('p-practice');return}
 const a=e.target.closest('[data-ans]');
 if(a){if(a.dataset.ans===S.round.word){S.round.completed=true;S.wrong=false;S.hint=false;go('p-reward')}else{S.wrong=true;render({keepFocus:true,focusSel:`[data-ans="${a.dataset.ans}"]`})}return}
 const tp=e.target.closest('[data-tphoto]');if(tp){S.upTarget=tp.dataset.tphoto;$('#file-in').click();return}
 const tr=e.target.closest('[data-treset]');if(tr){delete S.custom[tr.dataset.treset];savePhotos();render({keepFocus:true,focusSel:`[data-tphoto="${tr.dataset.treset}"]`});return}
 const j=e.target.closest('[data-jump]');if(j){e.preventDefault();const n=j.dataset.jump;(n==='words'?$('#f-words input'):$('#f-'+n)).focus();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 switch(b.dataset.act){
  case 'home':S.portal='student';render();break;
  case 'lang':S.lang=S.lang==='ms'?'en':'ms';saveSettings();applySettings();render({keepFocus:true});announce(S.lang==='ms'?'Bahasa Melayu':'English');break;
  case 'settings':settingsModal();break;
  case 'begin':go('p-photo');break;
  case 'camopen':openCamera();break;
  case 'camclose':stopCamera();S.sample=null;render({keepFocus:true,focusSel:'[data-act="camopen"]'});break;
  case 'upload':S.upTarget='student';$('#file-in').click();break;
  case 'take':takePhoto();break;
  case 'hear':speak(wordOf(S.round.word));break;
  case 'yes':S.round.via='match';S.hint=S.wrong=false;go('p-practice');break;
  case 'notsure':go('p-choose');break;
  case 'retake':resetPhoto();go('p-photo');break;
  case 'more':resetPhoto();S.round=null;S.hint=S.wrong=false;go('p-photo');break;
  case 'end':S.ended=true;S.sessionStarted=true;go('p-end');break;
  case 'newsession':startSession();go('p-start');break;
  case 'download':downloadSummary();break;
 }
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='setup-form')return;e.preventDefault();
 const names=['title','goal','code','words'];names.forEach(n=>S.touched[n]=true);
 const errs=names.map(n=>[n,setMsg(n)]).filter(x=>x[1]);const box=$('#errsum');
 if(errs.length){box.hidden=false;box.innerHTML=`<strong><span aria-hidden="true">⚠</span> ${t('errsum')}</strong><ul class="list">${errs.map(([n,m])=>`<li><a href="#f-${n}" data-jump="${n}">${m}</a></li>`).join('')}</ul>`;
  (errs[0][0]==='words'?$('#f-words input'):$('#f-'+errs[0][0])).focus();return}
 box.hidden=true;startSession();go('p-start');
});
document.addEventListener('input',e=>{
 const f=e.target.dataset&&e.target.dataset.f;
 if(f){S.lesson[f]=e.target.value;if(['title','goal','code'].includes(f))debounced(f)}
 if(e.target.dataset&&e.target.dataset.notes!==undefined)S.notes=e.target.value;
});
document.addEventListener('focusout',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f&&['title','goal','code'].includes(f)){clearTimeout(deb[f]);S.touched[f]=true;setMsg(f)}});
document.addEventListener('change',e=>{
 const tg=e.target;
 if(tg.dataset&&tg.dataset.w){const k=tg.dataset.w;const set=new Set(S.lesson.words);tg.checked?set.add(k):set.delete(k);S.lesson.words=WORDS.map(x=>x.k).filter(x=>set.has(x));S.touched.words=true;setMsg('words');return}
 if(tg.dataset&&tg.dataset.f==='standard')S.lesson.standard=tg.value;
 if(tg.id==='s-size'){S.settings.size=tg.value;saveSettings();applySettings()}
 if(tg.id==='s-theme'){S.settings.theme=tg.value;saveSettings();applySettings()}
 if(tg.id==='s-sound'){S.settings.sound=tg.checked;saveSettings()}
 if(tg.id==='s-motion'){S.settings.motion=tg.checked;saveSettings();applySettings()}
});
$('#file-in').addEventListener('change',e=>{
 const fin=e.target,f=fin.files&&fin.files[0];fin.value='';if(!f)return;
 readImage(f,640,url=>{
  if(S.upTarget==='student'){stopCamera();S.sample=null;S.photo={type:'camera',url};S.camErr=false;go('p-choose')}
  else{S.custom[S.upTarget]=url;savePhotos();render({keepFocus:true,focusSel:`[data-tphoto="${S.upTarget}"]`})}
 });
});

/* ---------- Camera ---------- */
async function openCamera(){
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  S.camOn=true;S.camErr=false;S.sample=null;S.photo=null;render({keepFocus:true,focusSel:'[data-act="camclose"]'});
 }catch(err){S.camOn=false;S.camErr=true;render({keepFocus:true,focusSel:'[data-act="camopen"]'})}
}
function takePhoto(){
 if(S.camOn){
  const v=$('#cam');const c=document.createElement('canvas');c.width=v.videoWidth||480;c.height=v.videoHeight||360;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);S.photo={type:'camera',url:c.toDataURL('image/jpeg',.8)};stopCamera();S.sample=null;
 }else if(S.sample){S.photo={type:'sample',key:S.sample}}else return;
 const key=matchResult(); // SIMULATED matching
 if(key){newRound(key,'match');S.hint=S.wrong=false;go('p-confirm')}else go('p-choose');
}

/* ---------- Download summary ---------- */
function downloadSummary(){
 const L=S.lesson;
 const lines=[`Satu Langkah – ${t('sm_h')}`,'',`${t('sm_pupil_code')}: ${L.code}`,`${t('sm_lesson')}: ${L.title} (${L.subject}, Standard ${L.standard})`,`${t('sm_goal')}: ${L.goal}`,'',`${t('sm_words')}:`,
  ...S.rounds.map(r=>`- ${wordOf(r.word)} (${r.via==='match'?t('sm_via_match'):t('sm_via_pick')}; ${r.completed?t('sm_done'):t('sm_notdone')})`),'',`${t('sm_supports')}:`,
  ...['ulang','bantu','rehat','henti'].map(k=>`- ${t(k)}: ${S.supports[k]>0?'✓':'–'}`),'',S.stopped?t('sm_stopped'):'',`${t('sm_notes')}: ${S.notes||'–'}`,'',t('sm_disc'),'(Demo prototype: photo matching simulated.)'];
